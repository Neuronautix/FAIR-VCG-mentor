    - {label: Danio rerio, synonyms: [zebrafish], iri: "http://purl.obolibrary.org/obo/NCBITaxon_7955"}
    - {label: Oryzias latipes, synonyms: [medaka], iri: "http://purl.obolibrary.org/obo/NCBITaxon_8090"}
    - {label: Drosophila melanogaster, synonyms: [fruit fly, drosophila], iri: "http://purl.obolibrary.org/obo/NCBITaxon_7227"}
    - {label: Caenorhabditis elegans, synonyms: [c. elegans, c elegans], iri: "http://purl.obolibrary.org/obo/NCBITaxon_6239"}
    - {label: Xenopus tropicalis, synonyms: [xenopus], iri: "http://purl.obolibrary.org/obo/NCBITaxon_8364"}
    - {label: Macaca mulatta, synonyms: [rhesus macaque, rhesus], iri: "http://purl.obolibrary.org/obo/NCBITaxon_9544"}
    - {label: Macaca fascicularis, synonyms: [cynomolgus macaque, cynomolgus], iri: "http://purl.obolibrary.org/obo/NCBITaxon_9541"}
    - {label: Callithrix jacchus, synonyms: [marmoset], iri: "http://purl.obolibrary.org/obo/NCBITaxon_9483"}
