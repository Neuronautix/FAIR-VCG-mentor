  sex_values:
    - {label: male, synonyms: [m], iri: "http://purl.obolibrary.org/obo/PATO_0000384"}
    - {label: female, synonyms: [f], iri: "http://purl.obolibrary.org/obo/PATO_0000383"}
  resource_types:
    - {label: Dataset}
    - {label: Collection}
    - {label: Image}
    - {label: Text}
    - {label: Software}
    - {label: PhysicalObject}
    - {label: Model}
    - {label: Workflow}
  credit_roles:
    - {label: Conceptualization, iri: "https://credit.niso.org/contributor-roles/conceptualization/"}
    - {label: Data Curation, iri: "https://credit.niso.org/contributor-roles/data-curation/"}
    - {label: Formal Analysis, iri: "https://credit.niso.org/contributor-roles/formal-analysis/"}
    - {label: Investigation, iri: "https://credit.niso.org/contributor-roles/investigation/"}
    - {label: Methodology, iri: "https://credit.niso.org/contributor-roles/methodology/"}
    - {label: Writing - Original Draft, iri: "https://credit.niso.org/contributor-roles/writing-original-draft/"}
