id: mnms-v1
name: MNMS Minimum Metadata Schema
version: 1.0.0
description: MNMS column schema for in-vivo animal study CSV files. Conforms to ARRIVE 2.0.
identifier: https://example.org/mnms/v1
conforms_to:
  - arrive-v2
ontology:
  iri: https://example.org/mnms/
  prefix: mnms

required_columns:
  - id: subject_id
    name_patterns:
      - unique_animal_identifier
      - animal_id
      - subject_id
    role: subject_id
    semantic_type: identifier
    arrive_section: Experimental animals / Total number
    severity: high
  - id: species
    name_patterns:
      - species
    arrive_section: Experimental animals / Species
    severity: high
  - id: strain
    name_patterns:
      - strain
    arrive_section: Experimental animals / Strain
    severity: medium
  - id: sex
    name_patterns:
      - sex
    arrive_section: Experimental animals / Sex
    severity: high
  - id: date_of_birth
    name_patterns:
      - date_of_birth
      - dob
    arrive_section: Experimental animals / Age
    severity: medium
  - id: weight_start
    name_patterns:
      - animal_weight_at_start
      - weight_at_start
      - start_weight
    unit_required: true
    unit_column: Weight_Unit
    arrive_section: Experimental animals / Weight
    severity: medium
  - id: supplier
    name_patterns:
      - supplier
      - vendor
    arrive_section: Experimental animals / Supplier
    severity: medium
  - id: xp_group
    name_patterns:
      - xp_group
      - experimental_group
      - group
    role: treatment
    arrive_section: Study design and sample size / Experimental groups incl. controls
    severity: high
  - id: dvc_cage
    name_patterns:
      - dvc cage identifier
      - dvc_cage_identifier
      - cage_id
    role: clustering_unit
    arrive_section: Study design and sample size / Experimental unit
    severity: medium
  - id: outcome
    name_patterns:
      - outcome_measure
      - value
      - outcome
    role: outcome
    unit_required: true
    unit_column: Unit_of_Measurement
    arrive_section: Outcome and statistics / Outcome measures
    severity: high
  - id: treatment_date
    name_patterns:
      - treatment_date
      - date_of_treatment
    role: time
    arrive_section: Study design and sample size / Timeline
    severity: medium
  - id: housing_density
    name_patterns:
      - housing_density
      - animals_per_cage
    arrive_section: Husbandry and welfare / Housing density
    severity: low
  - id: anaesthesia
    name_patterns:
      - anaesthesia
      - anesthesia
    arrive_section: Husbandry and welfare / Anaesthesia
    severity: low
  - id: analgesia
    name_patterns:
      - analgesia
    arrive_section: Husbandry and welfare / Analgesia
    severity: low
  - id: humane_endpoint
    name_patterns:
      - humane_endpoint
    arrive_section: Husbandry and welfare / Humane endpoints
    severity: low
  - id: adverse_event
    name_patterns:
      - adverse_event
    arrive_section: Husbandry and welfare / Adverse events
    severity: low
  - id: inclusion_flag
    name_patterns:
      - inclusion
      - included
    arrive_section: Study design and sample size / Inclusion criteria
    severity: low
  - id: exclusion_flag
    name_patterns:
      - exclusion
      - excluded
    arrive_section: Study design and sample size / Exclusion criteria
    severity: low
  - id: randomisation
    name_patterns:
      - randomisation
      - randomization
    arrive_section: Study design and sample size / Randomisation
    severity: medium
  - id: blinding
    name_patterns:
      - blinding
      - blinded
    arrive_section: Study design and sample size / Blinding
    severity: medium

optional_columns:
  - id: weight_end
    name_patterns:
      - animal_weight_at_end
      - end_weight
    unit_required: true
    unit_column: Weight_Unit
    arrive_section: Experimental animals / Weight
    severity: low
  - id: notes
    name_patterns:
      - notes
      - comments
    severity: low

required_metadata: []

vcg_defaults:
  treatment_col: xp_group
  outcome_cols_from: Outcome_Measure
  covariate_cols:
    - Sex
    - Animal_Weight_at_Start
    - Date_of_Birth
  clustering: DVC Cage Identifier
  method: auto

predefined_analyses:
  - id: arrive_completeness
    type: report
    description: ARRIVE 2.0 reporting completeness score
  - id: cage_effect_check
    type: stat
    description: ICC for cage-level clustering on outcome
    requires_columns:
      - DVC Cage Identifier
      - Outcome_Measure

fair_bonus:
  dimension: R
  max_points: 5
