id: namo-nam-assay-v1
name: "NAMO NAM Assay (dose-response / functional)"
version: "1.0"
description: >-
  Template for tabular datasets produced by New Approach Methodologies — organoid,
  organ-on-chip, or in-silico screening assays. Maps the realistic CSV shape
  (compound x concentration x endpoint) onto the NAMO LinkML schema's Study,
  NAMModel, FunctionalAssay, and DoseResponseSimilarity classes.
identifier: "https://w3id.org/monarch-initiative/namo"
conforms_to: []

ontology:
  iri: "https://w3id.org/monarch-initiative/namo"
  prefix: "NAMO"

class_iri_map:
  model_system_id: "NAMO:NAMModel.id"
  model_system_type: "NAMO:NAMModel"
  compound_id: "NAMO:DoseResponseSimilarity.compound_tested"
  concentration: "NAMO:Study.perturbations"
  assay_endpoint: "NAMO:FunctionalAssay.assay_type"
  response_value: "NAMO:FunctionalAssay.assay_result"
  replicate: "NAMO:Reproducibility"
  study_context_of_use: "NAMO:Study.context_of_use"
  biological_context: "NAMO:Study.biological_context"
  perturbations: "NAMO:Study.perturbations"
  endpoints: "NAMO:Study.endpoints"
  plan_comparators: "NAMO:Study.plan_comparators"
  model_system_class: "NAMO:NAMModel"
  iso_22916_compliance: "ISO:22916"
  miaca_compliance: "MIACA:cellular_assay"

required_columns:
  - id: model_system_id
    name_patterns: ["model_id", "model_system_id", "system_id"]
    semantic_type: identifier
    role: subject_id
    arrive_section: "NAMO / Model System"
    required: true
    severity: high

  - id: model_system_type
    name_patterns: ["model_system_type", "model_type", "system_type"]
    semantic_type: experimental_condition
    arrive_section: "NAMO / Model System"
    required: true
    severity: high

  - id: compound_id
    name_patterns: ["compound_id", "compound", "substance_id", "chemical_id", "test_substance"]
    semantic_type: experimental_condition
    role: treatment
    arrive_section: "NAMO / Perturbations"
    required: true
    severity: high

  - id: concentration
    name_patterns: ["concentration", "dose", "conc"]
    semantic_type: measurement
    arrive_section: "NAMO / Perturbations"
    unit_required: true
    unit_column: "concentration_unit"
    required: true
    severity: high

  - id: assay_endpoint
    name_patterns: ["assay_endpoint", "endpoint", "assay_type"]
    semantic_type: experimental_condition
    arrive_section: "NAMO / FunctionalAssay"
    required: true
    severity: high

  - id: response_value
    name_patterns: ["response", "response_value", "assay_result", "value"]
    semantic_type: measurement
    role: outcome
    unit_column: "response_unit"
    arrive_section: "NAMO / FunctionalAssay"
    required: true
    severity: high

optional_columns:
  - id: replicate
    name_patterns: ["replicate", "rep", "replicate_id"]
    semantic_type: identifier
    arrive_section: "NAMO / Reproducibility"
    required: false
    severity: low

required_metadata:
  - id: study_context_of_use
    arrive_section: "NAMO / Study"
    severity: high
  - id: biological_context
    arrive_section: "NAMO / Study"
    severity: high
  - id: perturbations
    arrive_section: "NAMO / Study"
    severity: medium
  - id: endpoints
    arrive_section: "NAMO / Study"
    severity: high
  - id: plan_comparators
    arrive_section: "NAMO / Study"
    severity: medium
  - id: model_system_class
    arrive_section: "NAMO / Model System"
    severity: high
  - id: iso_22916_compliance
    arrive_section: "NAMO / Compliance"
    severity: medium
  - id: miaca_compliance
    arrive_section: "NAMO / Compliance"
    severity: medium

vcg_defaults:
  treatment_col: "compound_id"
  outcome_cols_from: "response_value"
  covariate_cols: ["concentration", "model_system_type"]
  method: "auto"

predefined_analyses:
  - id: dose_response_summary
    type: report
    description: "Summary of dose-response coverage: compounds, concentrations, endpoints"
    requires_columns: ["compound_id", "concentration", "response_value"]

fair_bonus:
  dimension: R
  max_points: 5
